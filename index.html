<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Discrete Mathematics Notes</title>

  <link rel="stylesheet" href="style.css" />

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css"
  />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      svg: {
        fontCache: "global"
      }
    };
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
    async>
  </script>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="site-title" id="homeBtn">
        OneOcean
      </button>

      <button class="collapse-btn" id="collapseBtn" title="收折侧边栏">
        ☰
      </button>
    </div>

    <p class="course-title">Discrete Mathematics</p>

    <input
      id="search"
      type="text"
      placeholder="搜索笔记..."
    />

    <nav id="noteList"></nav>
  </aside>

  <button class="mobile-menu-btn" id="mobileMenuBtn">
    ☰
  </button>

  <main class="content" id="content">
    <article id="viewer" class="markdown-body">
      <h1>OneOcean Notes</h1>
      <p>欢迎来到你的课程笔记网站。</p>

      <h2>Discrete Mathematics</h2>
      <p>请从左侧选择 Markdown 或 PDF 笔记进行查看。</p>

      <p>支持：</p>
      <ul>
        <li>Markdown 在线阅读</li>
        <li>PDF 在线预览</li>
        <li>数学公式渲染</li>
        <li>笔记搜索</li>
        <li>侧边栏收折</li>
      </ul>

      <p>公式示例：</p>

      <p>
        $P \rightarrow Q$
      </p>

      <p>
        $$
        (P \vee Q) \vee R = P \vee (Q \vee R)
        $$
      </p>
    </article>
  </main>

  <script src="script.js"></script>
</body>
</html>
